<!doctype html>
<html lang="zh-CN" data-overlayscrollbars-initialize>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>近况</title>

    <!-- FOUT prevention: applies .dark before first CSS paint.
         COUPLING: reads Zustand persist envelope at localStorage key 'moments-theme'
         (format: { state: { theme: 'light' | 'dark' | null } }).
         If the storage key or envelope shape changes in src/store/theme.store.ts,
         update this script to match. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('moments-theme') || '{}');
          var pref = s.state && s.state.theme;
          var dark = pref === 'dark'
            ? true
            : pref === 'light'
            ? false
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

  </head>
  <body data-overlayscrollbars-initialize>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
