services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-moments}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moments_prod}
      POSTGRES_DB: moments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-moments}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Container always listens on port 3000 (hardcoded below and in Dockerfile).
    # Do NOT change app.port in config.yaml for Docker deployments —
    # change the host-side port (left of ':') if you need a different external port.
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
