services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-moments}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moments_prod}
      POSTGRES_DB: moments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-moments}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-moments}:${DB_PASSWORD:-moments_prod}@db:5432/moments
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      STORAGE_CONFIG_FILE: /app/config/storage.json
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:?TENCENT_COS_SECRET_ID is required}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:?TENCENT_COS_SECRET_KEY is required}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ../config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
